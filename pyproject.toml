[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-bundle-cli"
version = "0.1.0"
description = "Safely evaluate coding-agent solutions against task bundles."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Task Bundle CLI contributors" }]
dependencies = [
    "pydantic>=2.11,<3",
    "PyYAML>=6.0.2,<7",
    "rich>=14,<15",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
task = "task_bundle.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/task_bundle"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["task_bundle"]
